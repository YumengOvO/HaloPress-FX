name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run test:wordpress
      - run: node scripts/package-wordpress-plugin.mjs
      - name: Upload WordPress plugin
        uses: actions/upload-artifact@v4
        with:
          name: halopress-fx-wordpress
          path: releases/halopress-fx-*.zip
          if-no-files-found: error

  browser-pixels:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - name: Locate system Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path -LiteralPath $edge))
          {
            throw "Required system Edge was not found: $edge"
          }
          "BACLICKFX_CHROMIUM_PATH=$edge" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Chromium pixel regression
        run: npm run test:browser
      - name: Verify WordPress ZIP packaging on Windows
        run: node scripts/package-wordpress-plugin.mjs
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pixel-failure
          path: test-results/browser-pixels
          if-no-files-found: ignore
